<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spell Party – Fun Spelling Game for Kids</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3d6;--bg2:#ffd9ec;--card:#fff;--ink:#3b2a5a;--mut:#7a6a99;--pri:#7c4dff;--acc:#ff7a59;--ok:#22b768;--bad:#ef476f;--line:#e9defa;--sh:0 6px 0 rgba(60,30,110,.14);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1534;--bg2:#2d1d4d;--card:#2c2250;--ink:#fff3de;--mut:#bba9e6;--line:#43357a;--sh:0 6px 0 rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1534;--bg2:#2d1d4d;--card:#2c2250;--ink:#fff3de;--mut:#bba9e6;--line:#43357a;--sh:0 6px 0 rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;color:var(--ink);background:var(--bg);background-image:radial-gradient(circle at 15% 10%,var(--bg2),transparent 45%),radial-gradient(circle at 90% 90%,var(--bg2),transparent 40%);min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1{margin:0;font-size:clamp(34px,10vw,52px);letter-spacing:2px;color:var(--pri);text-shadow:3px 3px 0 var(--acc)}
h2{margin:18px 0 8px;font-size:20px}
.top{text-align:center;margin-bottom:8px}.top span.m{font-size:44px;display:inline-block;animation:bob 2s ease-in-out infinite}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.chip{background:var(--card);border-radius:99px;padding:6px 14px;font-weight:600;box-shadow:var(--sh);font-size:15px}
.card{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--sh);margin:12px 0}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.lv{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--card);border-radius:20px;padding:14px 18px;margin:10px 0;box-shadow:var(--sh);font-size:20px;border:3px solid transparent}
.lv:active,.btn:active,.tile:active{transform:translateY(3px)}.lv small{color:var(--mut);font-size:14px}.lv.lock{opacity:.8}
.lv:not(.lock):hover{border-color:var(--pri)}
.packs{display:flex;gap:8px;flex-wrap:wrap}.pk{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:6px 12px;font-size:14px}.pk.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.sb{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.st{aspect-ratio:1;border-radius:18px;background:var(--bg);border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:32px}.st small{font-size:12px;color:var(--mut)}.st.got{background:var(--card);border:2px solid var(--acc);animation:pop .5s}
.btn{background:var(--pri);color:#fff;border-radius:16px;padding:12px 18px;font-size:17px;font-weight:600;box-shadow:var(--sh);margin:4px}.btn.o{background:var(--acc)}.btn.g{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.row{display:flex;flex-wrap:wrap;justify-content:center}
.pic{font-size:clamp(90px,28vw,130px);text-align:center;line-height:1.1;animation:bob 2.5s ease-in-out infinite}
.slots,.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.slot{width:clamp(44px,13vw,60px);height:clamp(54px,16vw,70px);border-radius:14px;border:3px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;text-transform:uppercase;background:var(--card)}
.slot.f{border-style:solid;border-color:var(--pri)}.bad .slot{border-color:var(--bad);animation:shake .4s}.ok .slot{border-color:var(--ok);background:#d9f8e8;color:#0b5e33}
.tile{width:clamp(48px,14vw,64px);height:clamp(48px,14vw,64px);border-radius:16px;background:var(--acc);color:#fff;font-size:30px;font-weight:700;text-transform:uppercase;box-shadow:var(--sh);animation:bob 2s ease-in-out infinite}
.tile:nth-child(2n){background:var(--pri);animation-delay:.3s}.tile:nth-child(3n){background:#14a3c7;animation-delay:.6s}.tile.u{visibility:hidden}
.msg{text-align:center;font-size:24px;font-weight:700;min-height:34px;color:var(--ok)}.msg.b{color:var(--bad)}
.hdr{display:flex;justify-content:space-between;align-items:center}
.pre{background:linear-gradient(135deg,var(--pri),var(--acc));color:#fff;border-radius:24px;padding:18px;box-shadow:var(--sh)}
ul.f{padding-left:20px;line-height:1.7}.mut{color:var(--mut);font-size:14px}
textarea,input{font:inherit;width:100%;border-radius:14px;border:2px solid var(--line);padding:10px;background:var(--card);color:var(--ink)}
.bar{height:14px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.foot{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
@keyframes bob{50%{transform:translateY(-6px)}}@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.2)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style></head><body><div id="app"></div>
<script>

const WL=E.split(" ").map(x=>{const m=/^([a-z]+)(.+)([afsn])$/u.exec(x);return{w:m[1],e:m[2],p:m[3]}});
const lvl=w=>w.length<4?0:w.length==4?1:2;

const SUPPORT={holder:"",bank:"",acct:"",extra:"",cur:"",links:[]}; // links: [["Pay by card","https://..."]]
const CONTACT={email:"dgr8tconcepttech@gmail.com",whatsapp:"+2347068923757",site:"https://thedctech3.wordpress.com"};

let S={kids:[],cur:0,pre:true,list:""},V="home",P="m",G={},gate=null,R={};

const save=()=>{try{localStorage.setItem("spellparty1",JSON.stringify(S))}catch(e){}};
const $=document.getElementById("app"),go=v=>{V=v;draw();scrollTo(0,0)};
const say=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.8;speechSynthesis.speak(u)}catch(e){}};
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const custom=()=>(S.list||"").split(/[\n,]+/).map(x=>x.toLowerCase().replace(/[^a-z]/g,"")).filter(x=>x.length>1&&x.length<=10).map(w=>({w,e:"📝",p:"c"}));
function draw(){$.innerHTML=({home,play,rep,teach,priv,pgate,kids,sup,contact,terms,over:overV}[V])()}
function head(){return `<div class="top"><span class="m">🦉</span><h1>SPELL PARTY</h1><span class="m">🐰</span><div class="mut">Listen, look, and spell the word!</div><div class="mut" style="font-size:12px">Free for every child · No ads · No tracking</div></div>`}
function back(){return `<button class="btn g" onclick="go('home')">← Back</button>`}
function home(){
const lv=["🐣 Easy|3 letters","🐥 Medium|4 letters","🦉 Hard|5+ letters"].map((x,i)=>{const[n,d]=x.split("|"),l=i>0&&!S.pre;return `<button class="lv ${l?"lock":""}" onclick="${l?"go('pgate')":"start("+i+")"}"><b>${l?"🔒 ":""}${n}</b><small>${d}${l?" · Premium":""}</small></button>`}).join("");
const pk=PK.map(([k,n])=>{const l=k!="m"&&!S.pre;return `<button class="pk ${P==k?"on":""}" onclick="${l?"go('pgate')":"P='"+k+"';draw()"}">${l?"🔒 ":""}${n}</button>`}).join("");
const sb=ST.map(([n,e])=>S.stars>=n?`<div class="st got">${e}<small>${n}⭐</small></div>`:`<div class="st">❓<small>${n}⭐</small></div>`).join("");
return head()+`<div class="chips"><span class="chip">⭐ ${S.stars} stars</span><span class="chip">🏅 Best ${S.best}</span><span class="chip" style="cursor:pointer" onclick="go('kids')">${K().av} ${K().name} ▾</span></div>${advHtml()}<h2>🎓 Classic levels</h2>${lv}
<h2>Word packs</h2><div class="packs">${pk}</div><h2>🎁 Sticker Book</h2><div class="sb" onclick="cont()" style="cursor:pointer">${sb}</div><button class="btn o" style="width:100%;margin:10px 0" onclick="cont()">▶ Tap a sticker or here to keep playing${K().cp?" (Level "+K().cp.L+")":""}</button>
${S.pre?"":`<div class="pre" style="margin-top:18px"><b style="font-size:20px">👑 Go Premium</b><div>Medium and Hard levels, word packs, teacher word lists and a parent report.</div><button class="btn" style="background:#fff;color:var(--pri)" onclick="go('pgate')">See what’s inside</button></div>`}
<div class="pre" style="margin-top:18px"><b style="font-size:20px">💛 Support our work</b><div>Spell Party is free for every child. If it helps your family or class, you can help us add more words.</div><button class="btn" style="background:#fff;color:var(--pri)" onclick="gp('sup')">Support Spell Party</button></div><div class="foot"><button class="btn g" onclick="go('${S.pre?"rep":"pgate"}')">📊 Parent report</button><button class="btn g" onclick="go('${S.pre?"teach":"pgate"}')">✏️ My word list</button><button class="btn g" onclick="gp('contact')">✉️ Contact us</button><button class="btn g" onclick="go('terms')">📜 Terms</button><button class="btn g" onclick="go('priv')">🔒 Privacy</button></div>`}
function kids(){return back()+`<h2>👧 Players</h2>`+S.kids.map(k=>{const a=k.tot?Math.round(k.ok/k.tot*100):0;return `<div class="card hdr" style="margin:8px 0"><div><b style="font-size:20px">${k.av} ${k.name}</b>${k.id==S.cur?" ✅":""}<div class="mut">⭐ ${k.stars} · ${a}% correct</div></div><div><button class="btn" onclick="setKid(${k.id})">Play</button>${S.kids.length>1?`<button class="btn g" onclick="delKid(${k.id})">🗑️</button>`:""}</div></div>`}).join("")+`<div class="card"><b>Add a player</b><p class="mut">Use a nickname, not a full name. It stays on this device.</p><input id="kn" maxlength="14" placeholder="Name"><div class="row"><button class="btn o" onclick="addKid()">＋ Add player</button></div></div>`}
function setKid(i){S.cur=i;save();go("home")}
function addKid(){const n=document.getElementById("kn").value.replace(/[<>&"'`]/g,"").trim().slice(0,14)||"Player "+(S.kids.length+1),id=Date.now();S.kids.push({id,name:n,av:["🦊","🐼","🐯","🦄","🐸","🐙","🦁","🐨"][S.kids.length%8],stars:0,best:0,tot:0,ok:0,miss:{}});S.cur=id;save();go("home")}
function delKid(i){if(!confirm("Remove this player and their progress?"))return;S.kids=S.kids.filter(k=>k.id!=i);if(S.cur==i)S.cur=S.kids[0].id;save();draw()}
function sup(){const g=SUPPORT,row=(l,v)=>v?`<div class="card" style="margin:6px 0;padding:10px 14px"><small class="mut">${l}</small><div><b>${v}</b> <button class="btn g" style="padding:4px 10px;font-size:14px" onclick="navigator.clipboard&&navigator.clipboard.writeText('${v}');this.textContent='Copied ✓'">Copy</button></div></div>`:"";
return back()+`<h2>💛 Support our work</h2><div class="card"><p>Every feature of Spell Party is free. If it helps your child or class, a gift of any size helps us add new words, pictures and levels. Thank you!</p><p class="mut">Donations are optional gifts from adults. They don’t unlock anything, and they may not be tax-deductible. Payments are handled by your bank or payment provider, not by this app.</p>${g.links.map(([n,u])=>`<a class="btn o" style="display:inline-block;text-decoration:none" href="${u}" target="_blank" rel="noopener">${n}</a>`).join("")}${g.acct?`<h2>Bank transfer${g.cur?" ("+g.cur+")":""}</h2>`+row("Account name",g.holder)+row("Bank",g.bank)+row("Account number / IBAN",g.acct)+row("Routing / sort code / SWIFT",g.extra):""}${g.acct||g.links.length?"":'<p class="mut">Support options are coming soon.</p>'}</div>`}
function contact(){const c=CONTACT,w=c.whatsapp.replace(/\D/g,"");
return back()+`<h2>✉️ Contact us</h2><div class="card"><p><b>For parents and teachers.</b> Questions, word requests or school enquiries? We’d love to hear from you.</p><div class="row">${c.whatsapp?`<a class="btn o" style="text-decoration:none" href="https://wa.me/${w}" target="_blank" rel="noopener">💬 WhatsApp</a>`:""}${c.email?`<a class="btn" style="text-decoration:none" href="mailto:${c.email}?subject=Spell%20Party">📧 Email</a>`:""}${c.site?`<a class="btn g" style="text-decoration:none" href="${c.site}" target="_blank" rel="noopener">🌐 Website</a>`:""}</div></div><div class="card"><b>Send a message</b><input id="cn" placeholder="Your name" style="margin:8px 0"><textarea id="cm" rows="4" placeholder="Your message"></textarea><div class="row"><button class="btn o" onclick="sendMsg()">Send by email</button></div><p class="mut">This opens your email app with your message ready to send.</p></div>`}
function sendMsg(){const m=document.getElementById("cm").value+"\n\n"+document.getElementById("cn").value;location.href="mailto:"+CONTACT.email+"?subject="+encodeURIComponent("Spell Party message")+"&body="+encodeURIComponent(m)}
let T="sup";const gp=t=>{T=t;go("pgate")};
function wipe(){if(confirm("Delete ALL progress, players and word lists on this device?")){try{localStorage.removeItem("spellparty1")}catch(e){}location.reload()}}
function terms(){return back()+`<h2>📜 Terms of use</h2><div class="card"><ul class="f"><li>Spell Party is a free learning game for children. Every feature is free.</li><li>Donations are optional gifts from adults. They don’t unlock anything. Any refund is handled by your payment provider or bank, subject to your local law.</li><li>Children should play with a grown-up’s permission. Grown-ups are responsible for any links or payments they choose to use.</li><li>The game is provided as is, with no promise that it will always be available or error-free. Nothing here limits rights you have under law.</li><li>Pictures are system emoji, and speech comes from your device’s own voice.</li></ul><p class="mut">Last updated 25 October 2026. Questions? See Contact us.</p></div>`}
const RW='abcdefghijklmnopqrstuvwxyz',today=()=>new Date().toISOString().slice(0,10);
const AD='rhythm|A steady beat in music~beauty|Prettiness that pleases the eye~tongue|Muscle in the mouth used for tasting~vacuum|Machine that sucks up dust~receive|To get something sent to you~believe|To accept something as true~calendar|Chart of days and months~february|The shortest month~separate|To keep or set apart~occasion|A special event~pharmacy|Shop that sells medicines~embarrass|To make someone feel awkward~necessary|Needed; essential~wednesday|The midweek day~colleague|A person you work with~guarantee|A promise that something will happen~privilege|A special right or advantage~definitely|Without any doubt~restaurant|A place to eat out~conscience|Your sense of right and wrong~exaggerate|To describe as bigger than it is~parliament|Group that makes a country’s laws~millennium|A period of one thousand years~rhinoceros|Big animal with a horn on its nose~accommodate|To provide room or space for~maintenance|Keeping something in good working order~bureaucracy|Rule by many officials and procedures~questionnaire|A list of questions for a survey~mediterranean|The sea between Europe and Africa'.split('~').map(x=>{const[w,c]=x.split('|');return{w,e:'🧠',c}}).sort((a,b)=>a.w.length-b.w.length);
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pickW(L,ad,r){let p;if(ad){const a=Math.max(0,(L-1)*2),s=AD.slice(a,a+6);p=s.length?s:AD.slice(-6)}else{const n=L<4?3:L<7?4:L<11?5:L<16?6:7;p=WL.filter(x=>x.w.length==n);if(!p.length)p=WL.filter(x=>x.w.length>=n);if(!p.length)p=WL}return p[r()*p.length|0]}
function run(k,ad,L0){G={run:{k,ad,L:L0||1,hp:3,hn:3,sc:0,r:0,rnd:rng(+today().replace(/-/g,'')+(ad?7:0))},streak:0};nr()}
function nr(){const R=G.run,d=R.k=='d',L=d?[2,4,6,8,10][R.r]:R.L,boss=!d&&L%5==0;R.cl=L;let x,n=0;do{x=pickW(L,R.ad,d?R.rnd:Math.random)}while(x.w==R.last&&++n<6);R.last=x.w;
const dc=(L<4?0:Math.min(5,(L-1)/3|0))+(boss?2:0),tm=R.ad?Math.max(15,60-(L-1)*3):L<5?0:Math.max(12,40-(L-5)*2),ex=Array.from({length:dc},()=>RW[Math.random()*26|0]);
Object.assign(G,{w:x.w,e:x.e,clue:x.c||'',ans:[],t:shuf([...x.w,...ex]).map(c=>({c,u:0})),h:0,lock:0,res:'',nw:'',pts:0,boss});R.t=tm?tm+x.w.length*2:0;R.tm=R.t;V='play';draw();setTimeout(()=>say(G.w),300)}
function hud(){const R=G.run;return `<div class="row" style="gap:8px"><span class="chip">${R.k=='d'?'📅 Round '+(R.r+1)+'/5':'🏔️ Level '+R.L}${G.boss?' 👹 BOSS':''}</span><span class="chip">${'❤️'.repeat(R.hp)||'💔'}</span><span class="chip">🏆 ${R.sc}</span></div>${R.t?`<div class="bar" style="margin:8px 0"><i id="tb" style="width:${R.t/R.tm*100}%;background:var(--acc)"></i></div>`:''}`}
function advHtml(){const p=K(),dn=p.dd==today()?'✅ done today · ':'';return `<h2>🏔️ Adventures</h2><button class="lv" onclick="run('j',false)"><b>🏔️ Journey</b><small>Harder every level · best ${p.jb||0}</small></button><button class="lv" onclick="run('j',true)"><b>🧠 Grown-up Journey</b><small>Tricky words · best ${p.ab||0}</small></button><button class="lv" onclick="run('d',false)"><b>📅 Daily Challenge</b><small>${dn}🔥 ${p.ds||0} day streak</small></button><button class="lv" onclick="run('d',true)"><b>📅 Daily · Grown-ups</b><small>5 tricky words</small></button>`}
setInterval(()=>{const R=G.run;if(V!='play'||!R||G.lock||!R.t)return;R.t--;const b=document.getElementById('tb');if(b)b.style.width=R.t/R.tm*100+'%';if(R.t<=0)runChk(1)},1000);
let AC;function beep(f,d=.12){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function runChk(to){const R=G.run,a=G.ans.map(i=>G.t[i].c).join(''),ok=!to&&a==G.w;G.lock=1;G.res=ok?'ok':'bad';S.tot++;
if(ok){S.ok++;G.streak++;S.best=Math.max(S.best,G.streak);const g=G.boss?3:1,pts=(10*R.cl+G.streak*5+(R.t||0))*g*(G.h?.5:1)|0;R.sc+=pts;G.pts=pts;if(!G.h){S.stars+=g;const s=ST.find(x=>S.stars>=x[0]&&S.stars-g<x[0]);if(s)G.nw=s[1]}say(G.w);beep(660);setTimeout(()=>beep(880),120)}
else{S.miss[G.w]=(S.miss[G.w]||0)+1;G.streak=0;R.hp--;say(to?'Time is up. '+G.w:'Oops');beep(180,.3)}
save();draw();setTimeout(()=>{if(V!='play')return;if(R.hp<1)return over();if(ok){if(R.k=='d'){R.r++;if(R.r>=5)return over(1)}else{R.L++;K().cp={ad:R.ad,L:R.L};save()}nr()}else if(to)nr();else{G.ans=[];G.t.forEach(t=>t.u=0);G.lock=0;G.res='';draw()}},ok?1500:1200)}
function over(w){const R=G.run,p=K(),key=R.ad?'ab':'jb';if(R.k=='d'){if(w&&p.dd!=today()){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);p.ds=p.dd==y?(p.ds||0)+1:1;p.dd=today()}}else if(R.L>(p[key]||0))p[key]=R.L;save();G.over={w,sc:R.sc,lv:R.L,k:R.k,ad:R.ad};V='over';draw()}
function overV(){const o=G.over,p=K();return `<div class="top"><span class="m">${o.w?'🏆':'🌟'}</span><h2>${o.w?'Challenge complete!':o.k=='d'?'Good try!':'Run over'}</h2></div><div class="card" style="text-align:center"><p style="font-size:22px"><b>${o.sc}</b> points${o.k=='d'?'':`<br>Reached level <b>${o.lv}</b> (best ${p[o.ad?'ab':'jb']||0})`}</p>${o.k=='d'?`<p>🔥 Daily streak: <b>${p.ds||0}</b> day(s)</p>`:''}<div class="row"><button class="btn o" onclick="run('${o.k}',${o.ad})">Play again</button><button class="btn g" onclick="go('home')">Home</button></div></div>`}
function cont(){const c=K().cp;c?run('j',c.ad,c.L):run('j',false)}
function start(l){G={lv:l,streak:0};next()}
function next(){let pool=G.lv==3?custom():WL.filter(x=>lvl(x.w)==G.lv&&(P=="m"||x.p==P));if(!pool.length)pool=WL.filter(x=>lvl(x.w)==Math.min(G.lv,2));
if(pool.length>1)pool=pool.filter(x=>x.w!=G.w);const x=pool[Math.random()*pool.length|0];
G={lv:G.lv,streak:G.streak,w:x.w,e:x.e,ans:[],t:shuf(x.w.split("")).map(c=>({c,u:0})),h:0,lock:0,res:"",nw:""};V="play";draw();setTimeout(()=>say(G.w),300)}
function play(){const w=G.w,sl=[...w].map((c,i)=>`<div class="slot ${G.ans[i]!=null?"f":""}">${G.ans[i]!=null?G.t[G.ans[i]].c:""}</div>`).join("");
const tl=G.t.map((t,i)=>`<button class="tile ${t.u?"u":""}" onclick="tap(${i})">${t.c}</button>`).join("");
return `<div class="hdr">${back()}<div class="chips"><span class="chip">⭐ ${S.stars}</span><span class="chip">🔥 ${G.streak}</span></div></div>
<div class="card">${G.run?hud():""}<div class="pic">${G.e}</div>${G.clue?`<p class="mut" style="text-align:center;font-size:17px">${G.clue}</p>`:""}<div class="row"><button class="btn o" onclick="say(G.w)">🔊 Hear it</button></div>
<div class="slots ${G.res}">${sl}</div><div class="msg ${G.res=="bad"?"b":""}">${G.res=="ok"?"🎉 Great job!"+(G.pts?" +"+G.pts:"")+(G.nw?" New sticker "+G.nw:""):G.res=="bad"?"Oops, try again!":""}</div>
<div class="tiles">${tl}</div><div class="row"><button class="btn g" onclick="undo()">⌫ Erase</button><button class="btn g" onclick="hint()">💡 Hint${G.run?" ("+G.run.hn+")":""}</button></div></div>`}
function tap(i){if(G.t[i].u||G.lock)return;G.t[i].u=1;G.ans.push(i);draw();if(G.ans.length==G.w.length)chk()}
function undo(){if(G.lock||!G.ans.length)return;G.t[G.ans.pop()].u=0;draw()}
function hint(){if(G.lock)return;if(G.run){if(G.run.hn<1)return;G.run.hn--}G.h=1;let k=0;while(k<G.ans.length&&G.t[G.ans[k]].c==G.w[k])k++;while(G.ans.length>k)G.t[G.ans.pop()].u=0;const i=G.t.findIndex(x=>!x.u&&x.c==G.w[k]);if(i>=0){G.t[i].u=1;G.ans.push(i)}draw();if(G.ans.length==G.w.length)chk()}
function chk(){if(!G.run)return chk0();runChk()}
function chk0(){const a=G.ans.map(i=>G.t[i].c).join(""),r=a==G.w?"ok":"bad";G.lock=1;G.res=r;S.tot++;
if(r=="ok"){S.ok++;if(!G.h){S.stars++;G.streak++;S.best=Math.max(S.best,G.streak);const s=ST.find(x=>x[0]==S.stars);if(s)G.nw=s[1]}say("Great job! "+G.w)}else{S.miss[G.w]=(S.miss[G.w]||0)+1;G.streak=0}
save();draw();setTimeout(()=>{if(V!="play")return;if(r=="ok")next();else{G.ans=[];G.t.forEach(t=>t.u=0);G.lock=0;G.res="";draw()}},r=="ok"?1500:800)}
function rep(){const acc=S.tot?Math.round(S.ok/S.tot*100):0,m=Object.entries(S.miss).sort((a,b)=>b[1]-a[1]).slice(0,6);
return back()+`<h2>📊 ${K().name}’s report</h2><div class="card"><div class="chips"><span class="chip">⭐ ${S.stars} stars</span><span class="chip">🔥 Best streak ${S.best}</span></div>
<p>Words attempted: <b>${S.tot}</b><br>Spelled right: <b>${S.ok}</b> (${acc}%)</p><div class="bar"><i style="width:${acc}%"></i></div>
<h2>Words to practise</h2>${m.length?"<ul class='f'>"+m.map(([w,n])=>`<li><b>${w}</b> missed ${n}×</li>`).join("")+"</ul>":'<p class="mut">No misses yet. Great spelling!</p>'}
<button class="btn g" onclick="if(confirm('Reset this player’s progress?')){Object.assign(K(),{stars:0,best:0,tot:0,ok:0,miss:{}});save();draw()}">Reset progress</button></div>`}
function teach(){return back()+`<h2>✏️ My word list</h2><div class="card"><p class="mut">Teachers and parents: type this week’s spelling words, one per line (letters only, up to 10).</p>
<textarea id="tl" rows="8" placeholder="elephant&#10;friend&#10;because">${S.list||""}</textarea><div class="row"><button class="btn o" onclick="S.list=document.getElementById('tl').value;save();custom().length?start(3):alert('Add at least one word')">Save and play</button></div></div>`}
function pgate(){const a=3+Math.random()*6|0,b=4+Math.random()*5|0;gate=a+b;return back()+`<h2>🔒 Grown-ups only</h2><div class="card"><p class="mut">This area has links to other websites, payments and contact options.</p><p>To continue, solve: <b>${a} + ${b} = ?</b></p><input id="ga" type="number" inputmode="numeric"><div class="row"><button class="btn" onclick="+document.getElementById('ga').value==gate?go(T):alert('Not quite, ask a grown-up!')">Continue</button></div></div>`}
function prem(){return back()+`<div class="pre"><h2 style="margin-top:0">👑 Spell Party Premium</h2><ul class="f"><li>Medium and Hard levels</li><li>Animals, Food, School and Nature word packs</li><li>Your own spelling list for class or home</li><li>Parent progress report</li></ul>
<b style="font-size:22px">One-time unlock, no ads, no subscription</b>${S.pre?'<p>✅ Premium is active. Enjoy!</p>':`<div><button class="btn" style="background:#fff;color:var(--pri)" onclick="buy()">Unlock Premium</button></div>${PAY_LINK?"":'<small>Preview mode: unlocks on this device only.</small>'}`}</div>`}
function buy(){if(PAY_LINK){window.open(PAY_LINK,"_blank");return}S.pre=true;save();draw()}
function priv(){return back()+`<h2>🔒 Privacy for parents</h2><div class="card"><ul class="f"><li>No accounts. We don’t ask for your child’s full name, email or location. Player nicknames stay only on this device.</li><li>Stars, stickers and word lists are saved only on this device.</li><li>No ads, no trackers, no personal data sold or shared.</li><li>Word audio uses your device’s built-in voice.</li><li>Clearing your browser data removes all progress.</li></ul><h2>Children’s data</h2><p>Spell Party doesn’t collect personal information from anyone. Nothing you type, such as nicknames or word lists, is sent to us or to anyone else, so no accounts or consent forms are needed. This design is meant to respect the Nigeria Data Protection Act 2023, the US COPPA Rule and the EU/UK GDPR. If we ever add accounts, syncing or analytics, we will ask a parent or guardian for consent first and update this page.</p><h2>Outside links</h2><p>Links to WhatsApp, email, our website and donation pages are behind a grown-up check. Those services have their own privacy policies.</p><h2>Donations</h2><p>Donations are voluntary and are handled by your bank or payment provider. We never see or store card details, and nothing is unlocked by donating.</p><h2>Your control</h2><button class="btn g" onclick="wipe()">🗑️ Delete all data on this device</button><p class="mut">Last updated 25 October 2026.</p><p class="mut">Spell Party is designed for children.</p><h2>Contact us</h2><p>${CT()}</p></div>`}
draw();
</script></body></html>
